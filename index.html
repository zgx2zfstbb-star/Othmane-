<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wach Katbghini?</title>
<style>
  /* ---- إعدادات الصفحة ---- */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to bottom, #ffe6f0, #fff0f5);
    overflow-x: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* ---- قلوب عائمة ---- */
  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: #ff99cc;
    transform: rotate(-45deg);
    animation: float 8s infinite;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: #ff99cc;
    border-radius: 50%;
  }

  .heart::before {
    top: -10px;
    left: 0;
  }
  .heart::after {
    left: 10px;
    top: 0;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(-45deg); opacity: 1; }
    50% { transform: translateY(-200px) rotate(-45deg); opacity: 0.7; }
    100% { transform: translateY(-400px) rotate(-45deg); opacity: 0; }
  }

  /* ---- مركز المحتوى ---- */
  .container {
    text-align: center;
    z-index: 10;
  }

  .bear {
    font-size: 100px;
    display: block;
    margin-bottom: 20px;
    transition: transform 0.3s ease;
  }

  h1 {
    font-size: 2rem;
    color: #ff3399;
    margin-bottom: 30px;
  }

  /* ---- الأزرار ---- */
  .btn {
    padding: 15px 30px;
    margin: 10px;
    font-size: 1.2rem;
    cursor: pointer;
    border-radius: 50px;
    transition: all 0.3s ease;
  }

  .ah-btn {
    background: linear-gradient(45deg, #ff99cc, #ff66b2);
    border: none;
    color: white;
  }

  .ah-btn:hover {
    transform: scale(1.1);
  }

  .la-btn {
    background: transparent;
    border: 2px solid #ff3399;
    color: #ff3399;
  }

  .la-btn:hover {
    transform: scale(1.1);
  }

  /* ---- الرسائل ---- */
  .message {
    margin-top: 20px;
    font-size: 1.3rem;
    color: #ff3366;
    min-height: 2em;
    transition: all 0.3s ease;
  }

  /* ---- عند تمرير المؤشر على LA ---- */
  .la-btn:hover {
    opacity: 0;
  }

  /* ---- متجاوبة ---- */
  @media(max-width: 500px) {
    .bear { font-size: 60px; }
    h1 { font-size: 1.5rem; }
    .btn { padding: 10px 20px; font-size: 1rem; }
  }
</style>
</head>
<body>

<!-- قلوب عائمة -->
<div class="heart" style="left:10%; animation-delay:0s;"></div>
<div class="heart" style="left:30%; animation-delay:2s;"></div>
<div class="heart" style="left:50%; animation-delay:4s;"></div>
<div class="heart" style="left:70%; animation-delay:1s;"></div>
<div class="heart" style="left:90%; animation-delay:3s;"></div>

<div class="container">
  <span class="bear">🧸</span>
  <h1>Wach Katbghini?</h1>
  <button class="btn ah-btn">AH</button>
  <button class="btn la-btn">LA</button>
  <div class="message" id="msg"></div>
</div>

<script>
  const ahBtn = document.querySelector('.ah-btn');
  const laBtn = document.querySelector('.la-btn');
  const msg = document.getElementById('msg');

  const ahMessages = [
    "ta ana nbghik bzef othmane",
    "othmane hbiba",
    "kathma9 3liya yak"
  ];

  let ahIndex = 0;

  ahBtn.addEventListener('click', () => {
    if(ahIndex < ahMessages.length){
      msg.textContent = ahMessages[ahIndex];
      ahIndex++;
    } else {
      ahIndex = 0;
      msg.textContent = ahMessages[ahIndex];
      ahIndex++;
    }
  });

  laBtn.addEventListener('click', () => {
    msg.textContent = "ana 3arfa tbghini gol AH";
  });
</script>

</body>
</html>
